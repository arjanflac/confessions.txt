name: Local protocol checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm --prefix packages/cli ci --ignore-scripts
      - run: npm --prefix packages/cli test
      - run: node scripts/sync_web_modules.mjs --check
      - run: node scripts/check_package.mjs
      - run: python -m unittest discover -s tests
      - run: npm --prefix packages/cli audit --audit-level=high
